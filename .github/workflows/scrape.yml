name: Gwinnett County Lead Scraper

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days to look back (default 7)"
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scraper"
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & Publish
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}-${{ steps.date.outputs.date }}
          restore-keys: |
            pip-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}-
            pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml dbfread playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system dependencies only (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Create output directories
        run: |
          mkdir -p dashboard data

      - name: Run lead scraper
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scraper/fetch.py
        continue-on-error: false

      - name: Show output summary
        if: always()
        run: |
          python -c "
          import json, sys
          try:
              d = json.load(open('dashboard/records.json'))
              print(f\"Total: {d['total']}  |  With address: {d['with_address']}  |  Fetched: {d['fetched_at']}\")
              if d['records']:
                  top = d['records'][0]
                  print(f\"Top lead: {top.get('owner','?')} | score={top.get('score',0)} | type={top.get('cat_label','?')}\")
          except Exception as e:
              print(f'Error reading output: {e}', file=sys.stderr)
          "

      - name: Commit records.json files
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/ghl_export.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily lead scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  deploy-pages:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    if: ${{ success() || needs.scrape.result == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (after commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
